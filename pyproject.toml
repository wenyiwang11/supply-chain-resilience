[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supply-chain-resilience"
version = "0.1.0"
description = "Port disruption, trade rerouting, and supply chain recovery research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "polars>=1.0",
  "pyarrow>=17.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]
geo = ["geopandas>=1.0"]
ml = ["shap>=0.46", "xgboost>=2.1"]
econometrics = ["pyfixest>=0.28", "statsmodels>=0.14"]

[tool.hatch.build.targets.wheel]
packages = ["src/supply_chain_resilience"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

